<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src *; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="军师">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>军师</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1e222d; --line:#2b303d;
    --ink:#e6e8f0; --sub:#8f96a8; --dim:#5d6478;
    --me:#3d6bff; --ai:#20242f; --accent:#ffb454; --danger:#ff6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; height:100vh; height:100dvh;
    font-size:15px; line-height:1.65;
  }
  header{
    display:flex; align-items:center; gap:8px; padding:12px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:none;
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  header h1{
    font-size:16px; margin:0; font-weight:600; letter-spacing:.5px;
    max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  header .sp{flex:1}
  .iconbtn{
    background:var(--panel2); border:1px solid var(--line); color:var(--sub);
    border-radius:9px; padding:6px 11px; font-size:13px; cursor:pointer;
  }
  .iconbtn:active{background:var(--line)}
  .iconbtn.on{border-color:var(--accent); color:var(--accent)}
  #chat{flex:1; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:14px}
  .msg{display:flex; gap:9px; max-width:100%}
  .msg.user{flex-direction:row-reverse}
  .av{
    width:30px; height:30px; border-radius:9px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    background:var(--panel2); border:1px solid var(--line);
  }
  .msg.user .av{background:var(--me); border-color:var(--me)}
  .col{display:flex; flex-direction:column; gap:5px; max-width:calc(100% - 50px); min-width:0}
  .msg.user .col{align-items:flex-end}
  .bubble{
    background:var(--ai); border:1px solid var(--line); border-radius:13px;
    padding:10px 13px; white-space:pre-wrap; word-break:break-word;
    max-width:100%; font-size:15px;
  }
  .msg.user .bubble{background:var(--me); border-color:var(--me); color:#fff}
  .acts{display:flex; gap:6px; flex-wrap:wrap}
  .acts button{
    background:transparent; border:1px solid var(--line); color:var(--dim);
    border-radius:8px; padding:3px 9px; font-size:11.5px; cursor:pointer;
  }
  .acts button:active{background:var(--panel2); color:var(--sub)}
  .sys{text-align:center; color:var(--dim); font-size:12.5px; padding:6px 0}
  .quick{display:flex; gap:7px; flex-wrap:wrap; padding:0 14px 8px; flex:none}
  .quick button{
    background:var(--panel2); border:1px solid var(--line); color:var(--sub);
    border-radius:20px; padding:6px 13px; font-size:12.5px; cursor:pointer;
  }
  .quick button:active{background:var(--line)}
  footer{
    flex:none; background:var(--panel); border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:9px; align-items:flex-end;
  }
  footer textarea{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:12px; padding:10px 12px; font-family:inherit; font-size:16px;
    resize:none; line-height:1.5; min-height:44px; max-height:130px;
  }
  footer textarea:focus{outline:none; border-color:var(--accent)}
  footer button{
    background:var(--accent); color:#241a06; border:none; border-radius:12px;
    padding:11px 16px; font-size:15px; font-weight:700; cursor:pointer; flex:none;
  }
  footer button:disabled{opacity:.45}
  footer button.stop{background:var(--danger); color:#fff}
  /* 设置 / 历史抽屉 */
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    z-index:50; align-items:flex-end; justify-content:center;
  }
  #overlay.show{display:flex}
  #settings,#drawer{
    background:var(--panel); width:100%; max-width:640px; max-height:92vh;
    overflow-y:auto; border-radius:18px 18px 0 0; padding:18px;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  #drawer{max-height:80vh}
  #settings h2,#drawer h2{font-size:15px; margin:0 0 4px; color:var(--accent)}
  #drawer h2{margin-bottom:12px}
  #settings .grp{margin-bottom:20px}
  #settings label{display:block; font-size:12.5px; color:var(--sub); margin:10px 0 5px}
  #settings input,#settings textarea,#drawer input{
    width:100%; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); border-radius:9px; padding:9px 11px; font-size:16px;
    font-family:inherit;
  }
  #settings textarea{resize:vertical; line-height:1.6}
  #settings input:focus,#settings textarea:focus,#drawer input:focus{outline:none; border-color:var(--accent)}
  .hint{font-size:11.5px; color:var(--dim); margin-top:5px; line-height:1.55}
  .row{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap}
  .row button{
    flex:1; min-width:110px; background:var(--panel2); border:1px solid var(--line);
    color:var(--ink); border-radius:10px; padding:10px; font-size:14px; cursor:pointer;
  }
  .row button.primary{background:var(--accent); color:#241a06; border-color:var(--accent); font-weight:700}
  .row button.danger{color:var(--danger); border-color:#4a2b2b}
  .typing{color:var(--dim); font-size:13px}
  .err{color:#ffb4b4; font-size:13px; background:#2a1c1c; border:1px solid #4a2b2b; padding:8px 11px; border-radius:9px; margin:0 14px 8px; word-break:break-word}
  .ok{color:#b7f0c4; font-size:13px; background:#182a1c; border:1px solid #2b4a33; padding:8px 11px; border-radius:9px; margin:0 14px 8px}
  /* 代码块 / 表格卡片 */
  .bubble code{background:#0b0d12; padding:1px 5px; border-radius:4px; font-size:13.5px}
  .bubble pre{background:#0b0d12; border:1px solid var(--line); border-radius:9px; padding:10px 12px; overflow-x:auto; margin:8px 0}
  .bubble pre code{background:none; padding:0; font-size:13px; line-height:1.55}
  /* 用户气泡是蓝底，里面的代码块换成半透明深色，不然黑白撞得难看 */
  .msg.user .bubble pre{background:rgba(0,0,0,.28); border-color:rgba(255,255,255,.18)}
  .msg.user .bubble code{background:rgba(0,0,0,.28)}
  .sheet{display:flex; flex-direction:column; gap:8px; margin:10px 0; max-width:100%; overflow-x:auto}
  .sheet .sheetrow{display:flex; gap:8px}
  .sheet span{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:6px 11px; font-size:13px; white-space:nowrap; flex:1;
  }
  .sheet .sheetrow:first-child span{background:#262b38; color:var(--accent); font-weight:700}
  /* 历史列表 */
  .hitem{
    display:flex; align-items:center; gap:10px; padding:11px 12px;
    border:1px solid var(--line); border-radius:11px; background:var(--panel2);
    margin-bottom:8px; cursor:pointer;
  }
  .hitem.active{border-color:var(--accent); background:#221d12}
  .hitem .hmain{flex:1; min-width:0}
  .hitem .htitle{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hitem .hmeta{font-size:11.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px}
  .hitem .hdel{
    background:transparent; border:none; color:var(--dim); font-size:16px;
    padding:4px 6px; cursor:pointer; flex:none;
  }
  .hitem .hdel:active{color:var(--danger)}
  .hempty{color:var(--dim); font-size:13px; text-align:center; padding:18px 0}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="btnHist">☰</button>
  <h1 id="ttl">军师</h1>
  <span class="sp"></span>
  <button class="iconbtn" id="btnNew">新对话</button>
  <button class="iconbtn" id="btnSet">设置</button>
</header>

<div id="chat"></div>
<div class="quick" id="quick">
  <button data-q="我现在的处境，帮我理一遍，说重点。">理一遍处境</button>
  <button data-q="我这件事，你觉得我该怎么做？给具体的。">我该怎么做</button>
  <button data-q="我是不是在骗自己？直接说。">我是不是在骗自己</button>
  <button data-q="我该怎么回这条消息？">帮我回话</button>
  <button data-q="我这钱该怎么规划？">钱怎么规划</button>
</div>
<div id="errbox"></div>
<footer>
  <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
  <button id="btnSend">发送</button>
</footer>

<div id="overlay">
  <div id="settings">
    <div class="grp">
      <h2>⚙️ 接口设置</h2>
      <label>接口地址（OpenAI 兼容）</label>
      <input id="cfgBase" placeholder="https://api.deepseek.com/v1">
      <label>API Key</label>
      <form id="keyForm" autocomplete="off" onsubmit="return false">
        <input id="cfgKey" name="junshi-api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      </form>
      <label>模型名</label>
      <input id="cfgModel" placeholder="deepseek-chat">
      <div class="row"><button id="btnTest">🔌 测试连接</button></div>
      <div class="hint">支持任何 OpenAI 兼容接口（DeepSeek / 硅基流动 / 通义 / 本地 Ollama 等）。Key 只存在你这台设备的浏览器里，不上传任何地方。</div>
    </div>
    <div class="grp">
      <h2>🎭 人设（军师的性格）</h2>
      <textarea id="cfgPersona" rows="9"></textarea>
      <div class="hint">改这里就能换风格。默认设定：直接、不哄人、给具体动作、不说空话。<span id="statPersona"></span></div>
    </div>
    <div class="grp">
      <h2>📋 我的背景（军师每次都会看到）</h2>
      <textarea id="cfgContext" rows="12"></textarea>
      <div class="hint">把你自己的情况写这儿——越具体，他的建议越准。以后有变化随时改。背景**不会**被截断，写多长都会完整发过去。<span id="statCtx"></span></div>
    </div>
    <div class="row">
      <button class="primary" id="btnSave">保存</button>
      <button id="btnExport">导出当前</button>
      <button id="btnExportAll">导出全部</button>
    </div>
    <div class="row">
      <button class="danger" id="btnClear">清空当前对话</button>
    </div>
  </div>

  <div id="drawer">
    <h2>🗂 对话历史</h2>
    <input id="histSearch" placeholder="搜内容…">
    <div id="histList" style="margin-top:12px"></div>
  </div>
</div>

<script>
"use strict";
const LS_CFG="junshi_cfg_v1", LS_MSG="junshi_msg_v1", LS_CTX="junshi_ctx_v1",
      LS_PERSONA="junshi_persona_v1", LS_CONV="junshi_conv_v1", LS_ACT="junshi_act_v1";

const DEFAULT_PERSONA = `你是「军师」——只对我一个人负责的私人顾问。

【说话方式】
- 直接、不绕弯、不哄人。难听的话该说就说。
- 不灌鸡汤。"加油""一切都会好的""相信自己"这类话一律不说。
- 建议必须具体到"今天能做什么"，不说"你要调整心态"这种废话。
- 不确定就说不确定，不装懂、不编。
- 信息不够时先追问，别猜着给建议。
- 察觉我在自我欺骗时，直接点破，但不说教、不居高临下。

【你的能力】
- 理性拆解处境：感情、金钱、事业、人际。
- 懂命理（紫微斗数、梅花易数、大六壬），可以引用作为"参考视角"，但只当地图，不当判决书。
- 帮我把事情想清楚，而不是替我拍板。

【记住】
- 你的价值 = 说出我自己不愿看的那部分。
- 不要迎合我，不要顺着我的情绪说话。
- 但我难受的时候，先接住情绪，再讲事实——顺序不能反。
- 回答用中文，口语化，别写小标题堆砌的报告，像人一样说话。`;

const DEFAULT_CONTEXT = `【我是谁】
28岁，男，南京。生日：1998年闰五月十二 寅时。紫微命盘：命宫丁巳（廉贞、贪狼化禄、禄存、右弼化科），身宫辛酉官禄宫（武曲、七杀、左辅、地空）。2026年是我的破财年（廉贞化忌冲命宫+擎羊坐流年命宫）。

【现状】
- 2026年离职，目前无工作收入，今年支出约60万。
- 在学炒股（刚入门），计划明年去东北（但不确定去做什么）。

【A——同居4年的女友，1983年生（43岁）】
- 2022年至今，感情一直很好，基本不吵架；2026年端午节起争吵增多。
- 国庆后分居；明年我去东北，保持联系。她不上班，炒股+微商。
- 今年给她约50万。她教我炒股，也帮我炒。
- 她主动提过："停止钱，到过年，看还能不能开心聊下去。"

【B——网名"夏"，19岁，辽宁鞍山】
- 网上认识1-2个月，从未见面，视频/电话有过。她之前是做游戏陪玩的。
- 一个月给了约10万。她主动提过"停止钱到过年试试"，说"你说我是不是有病"。
- 她说过："我会选我爱的""我更怕"。她几乎不主动找我，回复多是表情包，但问了她会说。
- 她命盘：命宫辛卯（太阴落陷、左辅），夫妻宫天机化权+铃星+地空。当前大限走贪狼+陀罗。
- 背景：19岁、不上班、被母亲约束、有过1-2年暴力同居关系、前男友在押、关系未正式了结。

【我最纠结的】
舍不得A，又放不下B。我知道自己在纠结，但停不下来。`;

const SYS_NOTE = "\n\n【我的背景资料】\n";
const MAX_CTX_MSGS = 24;   // 每次只带最近 24 条，省 token；背景资料永远完整带上

let cfg = {base:"https://api.deepseek.com/v1", key:"", model:"deepseek-chat"};
let persona = "", ctxText = "";
let convs = [];            // [{id,title,createdAt,updatedAt,msgs:[{role,content,t}]}]
let actId = "";
let busy = false, abortCtl = null, lastUserText = "";
let dirty = false;   // 设置面板里有改动还没保存

const $ = id => document.getElementById(id);
const chatEl = $("chat");

/* ---------- 小工具 ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function mdLite(s){
  let out = esc(s);
  out = out.replace(/```([\s\S]*?)```/g, (m,code)=> "<pre><code>"+code.replace(/^\n/,"")+"</code></pre>");
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  return out;
}
function htmlToText(s){
  return String(s).replace(/<br\s*\/?>/g,"\n").replace(/<\/p>/g,"\n")
    .replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'").replace(/&amp;/g,"&");
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function dayKey(t){ const d=new Date(t); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function rel(t){
  if(!t) return "";
  const d = new Date(t), now = new Date();
  const hm = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(dayKey(t) === dayKey(now.getTime())) return "今天 "+hm;
  const y = new Date(now.getTime()-864e5);
  if(dayKey(t) === dayKey(y.getTime())) return "昨天 "+hm;
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}

/* ---------- 持久化 ---------- */
function saveCfg(){
  localStorage.setItem(LS_CFG, JSON.stringify(cfg));
  localStorage.setItem(LS_PERSONA, persona);
  localStorage.setItem(LS_CTX, ctxText);
}
function saveConvs(){
  try{
    localStorage.setItem(LS_CONV, JSON.stringify(convs));
    localStorage.setItem(LS_ACT, actId);
  }catch(e){
    showErr("存不下了 —— 浏览器本地存储满了。去「☰ 历史」删掉几个旧对话再聊。");
  }
}
function saveMsgsLegacy(){ // 保留旧键：万一出问题，原始记录还在
  try{
    const c = active();
    localStorage.setItem(LS_MSG, JSON.stringify(c ? c.msgs.map(m=>({role:m.role,content:m.content})) : []));
  }catch(e){}
}
function load(){
  try{ cfg = JSON.parse(localStorage.getItem(LS_CFG)||"{}") || {}; }catch(e){ cfg={}; }
  cfg.base  = cfg.base  || "https://api.deepseek.com/v1";
  cfg.model = cfg.model || "deepseek-chat";
  cfg.key   = cfg.key   || "";
  persona = localStorage.getItem(LS_PERSONA) || DEFAULT_PERSONA;
  ctxText = localStorage.getItem(LS_CTX) || DEFAULT_CONTEXT;
  try{ convs = JSON.parse(localStorage.getItem(LS_CONV)||"[]") || []; }catch(e){ convs=[]; }
  if(!Array.isArray(convs)) convs = [];
  convs = convs.filter(c => c && Array.isArray(c.msgs));
  actId = localStorage.getItem(LS_ACT) || "";
  if(!convs.length){
    // 把旧的单会话记录并进来
    let old = [];
    try{ old = JSON.parse(localStorage.getItem(LS_MSG)||"[]") || []; }catch(e){ old=[]; }
    if(Array.isArray(old) && old.length) old = old.filter(m => m && m.content).map(m=>({role:m.role,content:m.content,t:Date.now()}));
    const c = newConv(old.length ? "之前的对话" : "");
    c.msgs = old;
    convs = [c]; actId = c.id;
  }
  if(!convs.some(c => c.id === actId)) actId = convs[0].id;
  renderAll();
}
function newConv(title){
  const t = Date.now();
  return { id: uid(), title: title || "", createdAt: t, updatedAt: t, msgs: [] };
}
function active(){ return convs.find(c=>c.id===actId) || convs[0]; }
function autoTitle(c){
  if(c.title) return;
  const first = c.msgs.find(m=>m.role==="user");
  if(first) c.title = first.content.replace(/\s+/g," ").trim().slice(0,16);
}
let saveTimer = null;
function saveSoon(){          // 合并高频写入（例如：为每一轮对话补自动标题）
  if(saveTimer) return;
  saveTimer = setTimeout(()=>{ saveTimer = null; saveConvs(); }, 800);
}
function startNew(){
  if(convs.length && active() && active().msgs.length === 0){ $("input").focus(); return; }
  const c = newConv(""); convs.unshift(c); actId = c.id;
  saveConvs(); renderAll(); $("input").focus();
}
function openConv(id){
  if(!confirmLeave()) return;
  markDirty(false);
  actId = id; saveConvs(); renderAll();
  $("overlay").classList.remove("show");
}
function delConv(id, el){
  if(el) el.stopPropagation();
  const c = convs.find(x=>x.id===id); if(!c) return;
  const n = c.msgs.length;
  if(!confirm("删掉「" + (c.title || "新对话") + "」？" + (n ? "（" + n + " 条消息）" : "") + "\n删了就找不回来了。")) return;
  convs = convs.filter(x=>x.id!==id);
  if(!convs.length) convs = [newConv("")];
  if(actId === id) actId = convs[0].id;
  saveConvs(); renderAll();
}

/* ---------- 渲染 ---------- */
function renderAll(){
  const c = active();
  convs.forEach(autoTitle);           // 历史数据/旧版本升上来的对话补齐标题
  saveSoon();
  $("ttl").textContent = (c && c.title) ? c.title : "军师";
  renderChat();
  renderHist();
}
function renderChat(){
  const c = active();
  const msgs = c ? c.msgs : [];
  chatEl.innerHTML = "";
  if(!msgs.length){
    const d = document.createElement("div");
    d.className = "sys";
    d.textContent = cfg.key ? "说吧，我在。" : "先去「设置」填一下 API Key，我才能开口。";
    chatEl.appendChild(d);
  }
  msgs.forEach((m,i)=>{
    const wrap = document.createElement("div");
    wrap.className = "msg " + (m.role==="user" ? "user" : "ai");

    const av = document.createElement("div");
    av.className = "av";
    av.textContent = m.role==="user" ? "我" : "🧭";

    const col = document.createElement("div");
    col.className = "col";

    const b = document.createElement("div");
    b.className = "bubble";
    b.dataset.raw = m.content;
    b.innerHTML = mdLite(m.content);
    col.appendChild(b);

    const acts = document.createElement("div");
    acts.className = "acts";
    if(m.role === "user"){
      acts.appendChild(mkAct("复制", ()=>copyText(m.content)));
      acts.appendChild(mkAct("重发", ()=>retryOne(i)));
      acts.appendChild(mkAct("删除", ()=>delMsg(i)));
    }else{
      acts.appendChild(mkAct("复制", ()=>copyText(m.content)));
      acts.appendChild(mkAct("重新回答", ()=>retryOne(i)));
      acts.appendChild(mkAct("引用追问", ()=>{
        $("input").value = "关于你上面说的「" + m.content.replace(/\s+/g," ").slice(0,18) + "…」，我再问一句：";
        grow($("input")); $("input").focus();
      }));
      acts.appendChild(mkAct("删除", ()=>delMsg(i)));
    }
    col.appendChild(acts);

    wrap.appendChild(av); wrap.appendChild(col);
    chatEl.appendChild(wrap);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}
function mkAct(label, fn){
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}
function renderHist(){
  const q = ($("histSearch").value || "").trim().toLowerCase();
  const list = $("histList");
  list.innerHTML = "";
  const items = convs.filter(c=>{
    if(!q) return true;
    if((c.title||"").toLowerCase().includes(q)) return true;
    return c.msgs.some(m => String(m.content).toLowerCase().includes(q));
  });
  if(!items.length){
    const d = document.createElement("div");
    d.className = "hempty";
    d.textContent = q ? "没搜到。" : "还没有历史对话。";
    list.appendChild(d);
    return;
  }
  items.forEach(c=>{
    const it = document.createElement("div");
    it.className = "hitem" + (c.id===actId ? " active" : "");
    it.addEventListener("click", ()=>openConv(c.id));

    const main = document.createElement("div");
    main.className = "hmain";
    const t = document.createElement("div");
    t.className = "htitle";
    t.textContent = c.title || "新对话";
    const meta = document.createElement("div");
    meta.className = "hmeta";
    const last = c.msgs.length ? c.msgs[c.msgs.length-1] : null;
    meta.textContent = (c.msgs.length ? c.msgs.length + " 条 · " : "") + rel(c.updatedAt)
      + (last ? " · " + String(last.content).replace(/\s+/g," ").slice(0,24) : "");
    main.appendChild(t); main.appendChild(meta);

    const del = document.createElement("button");
    del.className = "hdel"; del.type = "button"; del.textContent = "✕";
    del.title = "删除";
    del.addEventListener("click", e => delConv(c.id, e));

    it.appendChild(main); it.appendChild(del);
    list.appendChild(it);
  });
}
function toast(msg, ok){
  const d = document.createElement("div");
  d.className = ok ? "ok" : "err";
  d.textContent = msg;
  $("errbox").innerHTML = "";
  $("errbox").appendChild(d);
  setTimeout(()=>{ if(d.parentNode) d.remove(); }, ok ? 1800 : 9000);
}
function showErr(msg){ toast(msg, false); }
function grow(el){ el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 130) + "px"; }

/* ---------- 消息操作 ---------- */
function copyText(text){
  const done = ()=>{ toast("已复制 ✅", true); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{ fallbackCopy(text, done); }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly","");
  ta.style.cssText = "position:fixed;left:-9999px;top:0;font-size:16px";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
  ta.remove();
  if(ok) done(); else showErr("这条没能自动复制（浏览器没给剪贴板权限）。长按消息手动选一下就行。");
}
function delMsg(i){
  const c = active(); if(!c) return;
  c.msgs.splice(i,1);
  c.updatedAt = Date.now();
  if(!c.msgs.some(m=>m.role==="user")) c.title = "";
  saveConvs(); saveMsgsLegacy(); renderAll();
}
function askAgain(text, i){
  const c = active(); if(!c) return;
  if(i >= 0) c.msgs.splice(i);          // 从这条开始往后全砍掉，重新生成
  c.updatedAt = Date.now();
  for(let k=c.msgs.length-1;k>=0;k--){ if(c.msgs[k].role==="user"){ c.msgs.splice(k,1); break; } }
  saveConvs(); renderAll();
  send(text);
}
function retryOne(i){
  const c = active(); if(!c || busy) return;
  let text = "";
  for(let k = Math.min(i, c.msgs.length-1); k >= 0; k--){
    if(c.msgs[k].role === "user"){ text = c.msgs[k].content; break; }
  }
  if(!text) return;
  askAgain(text, i);
}

/* ---------- 发送 ---------- */
function setBusy(on){
  busy = on;
  const b = $("btnSend");
  b.textContent = on ? "停止" : "发送";
  b.classList.toggle("stop", on);
  b.disabled = false;                     // 生成中也点得动 —— 用来中止
}
function stopGen(){
  if(abortCtl){ try{ abortCtl.abort(); }catch(e){} }
}
async function send(text, opts){
  opts = opts || {};
  if(busy){ showErr("还在生成，等一下，或点「停止」。"); return; }
  text = (text||"").trim();
  if(!text) return;
  if(!cfg.key){ showErr("还没填 API Key —— 点右上角「设置」填一下。"); return; }

  const c = active(); if(!c) return;
  $("input").value = ""; grow($("input"));
  lastUserText = text;
  c.msgs.push({role:"user", content:text, t:Date.now()});
  c.updatedAt = Date.now();
  autoTitle(c);
  saveConvs(); saveMsgsLegacy(); renderAll();

  // 占位气泡
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.innerHTML = '<div class="av">🧭</div><div class="col"><div class="bubble" data-streaming="1"><span class="typing">正在想…</span></div></div>';
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  const bubble = wrap.querySelector(".bubble");

  setBusy(true);
  abortCtl = new AbortController();

  const sys = persona + SYS_NOTE + ctxText;
  const history = c.msgs.slice(-MAX_CTX_MSGS).map(m=>({role:m.role, content:m.content}));
  const payload = {
    model: cfg.model,
    stream: true,
    temperature: 0.85,
    messages: [{role:"system", content:sys}, ...history]
  };

  let acc = "";
  let finalErr = "";
  try{
    const url = cfg.base.replace(/\/+$/,"") + "/chat/completions";
    const res = await fetch(url, {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + cfg.key},
      body: JSON.stringify(payload),
      signal: abortCtl.signal
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error("HTTP " + res.status + " " + t.slice(0,200));
    }
    const ct = (res.headers.get("content-type")||"");
    if(ct.includes("application/json")){
      // 有些接口不吃 stream，退化成一次性返回
      const j = await res.json();
      acc = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
      bubble.dataset.raw = acc; bubble.innerHTML = mdLite(acc);
    }else{
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      bubble.innerHTML = "";
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split("\n");
        buf = lines.pop();
        for(const line of lines){
          const s = line.trim();
          if(!s.startsWith("data:")) continue;
          const data = s.slice(5).trim();
          if(data === "[DONE]") continue;
          try{
            const j = JSON.parse(data);
            const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if(delta){
              acc += delta;
              bubble.dataset.raw = acc;
              bubble.innerHTML = mdLite(acc);
              chatEl.scrollTop = chatEl.scrollHeight;
            }
          }catch(e){}
        }
      }
    }
    bubble.dataset.streaming = "0";
    if(!acc){
      bubble.textContent = "（这次没收到内容，再发一次试试）";
      showErr("接口返回空内容。检查模型名对不对、余额够不够。");
    }else{
      c.msgs.push({role:"assistant", content:acc, t:Date.now()});
      c.updatedAt = Date.now();
      saveConvs(); saveMsgsLegacy();
    }
    renderAll();
  }catch(e){
    const aborted = e && (e.name === "AbortError" || /abort/i.test(String(e.message||"")));
    if(aborted){
      if(acc){
        c.msgs.push({role:"assistant", content:acc + "\n\n（手动中止）", t:Date.now()});
        c.updatedAt = Date.now(); saveConvs(); saveMsgsLegacy();
      }else{
        showErr("已停止。");
      }
    }else{
      // 失败就撤干净：把这句话从上下文里拿掉、还回输入框。
      // 否则失败的消息会留在历史里污染后面的对话，而界面上却看不到它发成功过。
      wrap.remove();
      const tail = c.msgs[c.msgs.length - 1];
      if(tail && tail.role === "user" && tail.content === text) c.msgs.pop();
      if(!c.msgs.some(m => m.role === "user")) c.title = "";
      c.updatedAt = Date.now();
      saveConvs(); saveMsgsLegacy();
      if(!$("input").value) $("input").value = text;
      grow($("input"));
      renderAll();
      finalErr = "没发出去（" + (e && e.message ? e.message : e) + "）—— 话给你放回输入框了，检查一下接口地址 / Key / 网络再点发送。";
    }
  }finally{
    abortCtl = null; setBusy(false);
    if(!$("overlay").classList.contains("show")) $("input").focus();
    if(finalErr) showErr(finalErr);   // 放在最后，避免被 renderAll 清掉
  }
}

/* ---------- 导出 ---------- */
function dl(name, text){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,"-"); }
function exportOne(){
  const c = active();
  const body = (c ? c.msgs : []).map(m => (m.role==="user" ? "【我】" : "【军师】") + "\n" + m.content).join("\n\n");
  dl("军师_" + ((c && c.title) || "对话") + "_" + stamp() + ".txt",
     "《军师》对话记录\n时间：" + new Date().toLocaleString("zh-CN") + "\n主题：" + ((c && c.title) || "（无）") + "\n\n" + (body || "（暂无对话）"));
}
function exportAll(){
  const parts = convs.map(c=>{
    const body = c.msgs.map(m => (m.role==="user" ? "【我】" : "【军师】") + "\n" + m.content).join("\n\n");
    return "═══════════ " + (c.title || "新对话") + " ═══════════\n"
      + "时间：" + new Date(c.createdAt).toLocaleString("zh-CN") + " ｜ " + c.msgs.length + " 条\n\n" + (body || "（空）");
  });
  dl("军师_全部对话_" + stamp() + ".txt",
     "《军师》全部对话备份\n导出时间：" + new Date().toLocaleString("zh-CN") + " ｜ 共 " + convs.length + " 个对话\n\n\n" + parts.join("\n\n\n"));
}

/* ---------- 设置 ---------- */
function markDirty(on){
  dirty = on;
  const b = $("btnSave");
  b.textContent = on ? "保存 •" : "保存";
}
function confirmLeave(){
  if(!dirty) return true;
  return confirm("设置里有改动还没保存，就这么走？\n（不保存的话，人设和背景资料的改动会丢）");
}
function statLine(){
  $("statPersona").textContent = "　当前 " + persona.length + " 字";
  $("statCtx").textContent = "　当前 " + ctxText.length + " 字";
}
async function testConn(){
  const base = ($("cfgBase").value.trim() || "https://api.deepseek.com/v1").replace(/\/+$/,"");
  const key = $("cfgKey").value.trim();
  const model = $("cfgModel").value.trim() || "deepseek-chat";
  if(!key){ showErr("先填 API Key。"); return; }
  const btn = $("btnTest");
  btn.disabled = true; btn.textContent = "测试中…";
  const t0 = Date.now();
  try{
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), 25000);
    const res = await fetch(base + "/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + key},
      body: JSON.stringify({model:model, messages:[{role:"user",content:"收到请只回复两个字：正常"}], max_tokens:16, stream:false}),
      signal: ctl.signal
    });
    clearTimeout(timer);
    const ms = Date.now() - t0;
    const txt = await res.text();
    if(!res.ok){
      let detail = txt.slice(0,300);
      try{ const j = JSON.parse(txt); detail = (j.error && (j.error.message||j.error.code)) || detail; }catch(e){}
      toast("❌ 失败了（HTTP " + res.status + "）：" + detail, false);
      return;
    }
    let reply = "";
    try{
      const j = JSON.parse(txt);
      reply = (j.choices && j.choices[0] && (j.choices[0].message ? j.choices[0].message.content : j.choices[0].text)) || "";
    }catch(e){}
    toast("✅ 通了（" + ms + "ms，模型 " + model + "）" + (reply ? "，它回了：" + String(reply).trim().slice(0,20) : ""), true);
  }catch(e){
    toast("❌ 连不上：" + (e && e.message ? e.message : e) + "（网络？地址写错？被墙？）", false);
  }finally{
    btn.disabled = false; btn.textContent = "🔌 测试连接";
  }
}

/* ---------- 事件 ---------- */
$("btnSend").addEventListener("click", ()=>{
  if(busy){ stopGen(); return; }
  send($("input").value);
});
$("input").addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); if(!busy) send(this.value); }
});
$("input").addEventListener("input", function(){ grow(this); });
$("quick").addEventListener("click", e=>{
  if(e.target.tagName==="BUTTON" && !busy) send(e.target.dataset.q);
});
$("btnNew").addEventListener("click", startNew);
$("btnHist").addEventListener("click", ()=>{
  if(!confirmLeave()) return;
  markDirty(false);
  $("histSearch").value = "";
  renderHist();
  $("drawer").style.display = "block";
  $("settings").style.display = "none";
  $("overlay").classList.add("show");
});
$("btnSet").addEventListener("click", ()=>{
  if(!confirmLeave()) return;
  $("cfgBase").value = cfg.base; $("cfgKey").value = cfg.key || ""; $("cfgModel").value = cfg.model;
  $("cfgPersona").value = persona; $("cfgContext").value = ctxText;
  statLine(); markDirty(false);
  $("drawer").style.display = "none";
  $("settings").style.display = "block";
  $("overlay").classList.add("show");
});
$("overlay").addEventListener("click", e=>{
  if(e.target.id !== "overlay") return;
  if(!confirmLeave()) return;
  markDirty(false);
  $("overlay").classList.remove("show");
});
["cfgBase","cfgKey","cfgModel","cfgPersona","cfgContext"].forEach(id=>{
  $(id).addEventListener("input", ()=>{ markDirty(true); statLine(); });
});
$("histSearch").addEventListener("input", renderHist);
$("btnTest").addEventListener("click", testConn);
$("btnSave").addEventListener("click", ()=>{
  cfg.base = $("cfgBase").value.trim() || "https://api.deepseek.com/v1";
  cfg.key = $("cfgKey").value.trim();
  cfg.model = $("cfgModel").value.trim() || "deepseek-chat";
  persona = $("cfgPersona").value.trim() || DEFAULT_PERSONA;
  ctxText = $("cfgContext").value.trim();
  saveCfg(); markDirty(false);
  $("overlay").classList.remove("show");
  renderAll();
  toast("已保存 ✅", true);
});
$("btnClear").addEventListener("click", ()=>{
  const c = active(); if(!c) return;
  if(c.msgs.length && !confirm("清空「" + (c.title || "新对话") + "」里的全部 " + c.msgs.length + " 条消息？\n（对话本身会留着，但内容没了）")) return;
  c.msgs = []; c.title = ""; c.updatedAt = Date.now();
  saveConvs(); saveMsgsLegacy(); renderAll();
  $("overlay").classList.remove("show");
});
$("btnExport").addEventListener("click", exportOne);
$("btnExportAll").addEventListener("click", exportAll);

load();
$("input").focus();
</script>
